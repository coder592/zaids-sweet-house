<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details | Zaid's Sweet House</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">

        <img
            src="images/logo.png"
            alt="Logo"
        >

        <span>
            Zaid's Sweet House
        </span>

    </div>


    <ul>

        <li>
            <a href="index.html">
                Home
            </a>
        </li>

    </ul>

</nav>



<!-- ================= PRODUCT DETAILS ================= -->

<section class="product-page">


    <!-- PRODUCT IMAGE -->

    <div class="product-image">

        <img
            src="images/kaju-katli.jpg"
            alt="Product"
            id="productImage"
        >

    </div>



    <!-- PRODUCT INFORMATION -->

    <div class="product-details">

        <h1 id="productName">
            Kaju Katli
        </h1>


        <div class="rating">
            ⭐⭐⭐⭐⭐
        </div>


        <h2 id="productPrice">
            ₹699 / kg
        </h2>


        <p
            id="productOffer"
            class="offer"
        >
            15% OFF
        </p>


        <p class="stock">
            ✅ In Stock
        </p>



        <!-- ================= QUANTITY ================= -->

        <div class="quantity">

            <button
                type="button"
                onclick="decreaseQty()"
            >
                −
            </button>


            <span id="qty">
                1
            </span>


            <button
                type="button"
                onclick="increaseQty()"
            >
                +
            </button>

        </div>



        <!-- ================= ADD TO CART ================= -->

        <button
            type="button"
            onclick="addCurrentProduct()"
        >
            🛒 Add To Cart
        </button>



        <!-- ================= BUY NOW ================= -->

        <button
            type="button"
            onclick="buyNow()"
        >
            Buy Now
        </button>


    </div>

</section>



<!-- ================= PRODUCT DATA ================= -->

<script>

let quantity = 1;

function increaseQty() {

    quantity++;

    document.getElementById("qty").innerText = quantity;

}


function decreaseQty() {

    if (quantity > 1) {

        quantity--;

        document.getElementById("qty").innerText = quantity;

    }

}


function addCurrentProduct() {

    const productId =
        new URLSearchParams(
            window.location.search
        ).get("product");

    const product =
        products[productId];

    if (!product) {

        alert("Product not found ❌");

        return;

    }


    const price =
        Number(
            product.price.replace(/[^\d.]/g, "")
        );


    if (!Number.isFinite(price)) {

        alert("Product price is invalid ❌");

        return;

    }


    let cart = [];

    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "zaidsSweetHouseCart"
                )
            ) || [];

        if (!Array.isArray(cart)) {

            cart = [];

        }

    } catch (error) {

        cart = [];

    }


    const existingItem =
        cart.find(function(item) {

            return (
                item.name === product.name &&
                !item.weight
            );

        });


    if (existingItem) {

        existingItem.quantity =
            Number(existingItem.quantity || 0)
            + quantity;

    } else {

        cart.push({

            name: product.name,

            price: price,

            quantity: quantity

        });

    }


    localStorage.setItem(
        "zaidsSweetHouseCart",
        JSON.stringify(cart)
    );


    alert(
        `${product.name} × ${quantity} added to cart 🛒`
    );

}


function buyNow() {

    addCurrentProduct();

    setTimeout(function() {

        window.location.href =
            "index.html#checkout";

    }, 300);

}

</script>



<!-- ================= JAVASCRIPT ================= -->

<script src="script.js"></script>


</body>

</html>
