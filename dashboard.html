<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | Zaid's Sweet House</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ==========================================
     ADMIN DASHBOARD SECURITY
========================================== -->

<script>

(function () {

    if (
        sessionStorage.getItem("adminLoggedIn")
        !== "true"
    ) {

        window.location.replace("admin.html");

        return;

    }


    window.history.replaceState(
        null,
        "",
        window.location.href
    );


    window.addEventListener(
        "popstate",
        function () {

            window.history.pushState(
                null,
                "",
                window.location.href
            );

        }
    );


    document.addEventListener(
        "visibilitychange",
        function () {

            if (
                document.visibilityState ===
                "visible"
            ) {

                if (
                    sessionStorage.getItem(
                        "adminLoggedIn"
                    ) !== "true"
                ) {

                    window.location.replace(
                        "admin.html"
                    );

                }

            }

        }
    );

})();


window.addEventListener(
    "pageshow",
    function () {

        if (
            sessionStorage.getItem(
                "adminLoggedIn"
            ) !== "true"
        ) {

            window.location.replace(
                "admin.html"
            );

        }

    }
);

</script>



<!-- ==========================================
     ADMIN HEADER
========================================== -->

<header class="admin-header">

    <div>

        <h1>
            🍬 Zaid's Sweet House
        </h1>

        <p>
            Admin Dashboard
        </p>

    </div>


    <button
        type="button"
        id="logoutAdminBtn"
    >
        🚪 Logout
    </button>

</header>



<!-- ==========================================
     MAIN DASHBOARD
========================================== -->

<main class="admin-dashboard">


    <h2>
        Dashboard Overview
    </h2>



    <!-- ==========================================
         STATISTICS
    =========================================== -->

    <div class="admin-stats">


        <!-- TOTAL ORDERS -->

        <div class="admin-stat-card">

            <h3>
                📦 Total Orders
            </h3>

            <p id="totalOrders">
                0
            </p>

        </div>



        <!-- TOTAL SALES -->

        <div class="admin-stat-card">

            <h3>
                💰 Total Sales
            </h3>

            <p>
                ₹<span id="totalSales">0</span>
            </p>

        </div>


    </div>



    <!-- ==========================================
         CUSTOMER ORDERS
    =========================================== -->

    <section class="admin-orders">


        <div class="admin-orders-header">

            <h2>
                📦 Customer Orders
            </h2>


            <button
                type="button"
                id="clearOrdersBtn"
            >
                🗑️ Clear Orders
            </button>

        </div>



        <!-- ==========================================
             SEARCH
        =========================================== -->

        <div class="admin-search">

            <input
                type="text"
                id="adminOrderSearch"
                placeholder="🔎 Search Order ID, customer or phone..."
            >

        </div>



        <!-- ==========================================
             ORDERS LIST
        =========================================== -->

        <div id="ordersList">

            <div class="no-orders">

                <h3>
                    Loading orders...
                </h3>

                <p>
                    Please wait.
                </p>

            </div>

        </div>


    </section>


</main>



<!-- ==========================================
     FIREBASE CONFIG
========================================== -->

<script src="firebase-config.js"></script>


<!-- ==========================================
     FIREBASE
========================================== -->

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    deleteDoc,
    doc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* ==========================================
   FIREBASE INITIALIZATION
========================================== */

const app =
    initializeApp(
        window.firebaseConfig
    );



/* ==========================================
   FIREBASE AUTH
========================================== */

const auth =
    getAuth(app);



/* ==========================================
   FIRESTORE
========================================== */

const db =
    getFirestore(app);



window.firebaseDB =
    db;


window.firebaseAuth =
    auth;



/* ==========================================
   FIREBASE DELETE
========================================== */

window.firebaseDeleteDoc =
    deleteDoc;


window.firebaseDoc =
    doc;



/* ==========================================
   FIREBASE ORDERS
========================================== */

window.firebaseGetOrders =
    async function () {

        return await getDocs(
            collection(
                db,
                "orders"
            )
        );

    };



console.log(
    "Firebase dashboard connected"
);



/* ==========================================
   ADMIN AUTHENTICATION
========================================== */

onAuthStateChanged(
    auth,
    function (user) {


        if (!user) {

            console.error(
                "Firebase admin authentication missing."
            );

            sessionStorage.removeItem(
                "adminLoggedIn"
            );

            window.location.replace(
                "admin.html"
            );

            return;

        }



        console.log(
            "Firebase admin authenticated:",
            user.email
        );



        /* ==========================================
           ALLOWED ADMIN EMAIL
        ========================================== */

        if (
            user.email !==
            "mdzaidqureshi28@gmail.com"
        ) {

            console.error(
                "Unauthorized Firebase account."
            );

            sessionStorage.removeItem(
                "adminLoggedIn"
            );

            window.location.replace(
                "admin.html"
            );

            return;

        }



        /* ==========================================
           LOAD DASHBOARD
        ========================================== */

        if (
            typeof window.loadAdminOrders ===
            "function"
        ) {

            window.loadAdminOrders();

        }

    }
);

</script>



<!-- ==========================================
     DASHBOARD JAVASCRIPT
========================================== -->

<script src="dashboard.js"></script>


</body>

</html>
